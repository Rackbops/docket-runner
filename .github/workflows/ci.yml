name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: just install
      # lint, typecheck, tests (vitest against test/fixtures/fake-claude.mjs -- never the real CLI,
      # never the subscription; then deploy/render.test.mjs), build.
      - run: just check

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Proves the Dockerfile builds and the pinned CLI runs in it. Nothing is pushed.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: docket-runner:ci
      - run: docker run --rm --entrypoint claude docket-runner:ci --version
