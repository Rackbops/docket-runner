name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: just install
      # lint, typecheck, tests (vitest against test/fixtures/fake-claude.mjs -- never the real CLI,
      # never the subscription; then deploy/render.test.mjs), build.
      - run: just check

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Proves the Dockerfile builds and the pinned CLI runs in it. Nothing is pushed.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: docket-runner:ci
      - run: docker run --rm --entrypoint claude docket-runner:ci --version

  # The end-to-end check (`just e2e`, test/e2e/run.sh; CONTEXT.md, "The end-to-end check"): the
  # tracker's executor -> a real city-hall -> this runner (fake CLI) -> back to the tracker.
  #
  # It needs Lepid-Labs/city-hall, which is private. CITY_HALL_READ_TOKEN is a fine-grained PAT
  # (resource owner Lepid-Labs, city-hall only, Contents read-only) that Lepid-Labs' owner must
  # approve before it can read anything. The probe step decides what happens without access:
  # - no secret (a fork or Dependabot PR, or the secret is unset), 401 (expired or revoked), or
  #   403/404 (not approved yet): a ::warning:: saying why, the same line in the job summary, every
  #   later step skipped, and the job stays green -- unless the repo variable E2E_REQUIRED is
  #   `true`, which turns each of those into an ::error:: and a red job;
  # - no response (000) or any other code, 5xx included, after curl's retries: a red job, always.
  # Skipping is deliberate: the job turns itself on the first run after the token is approved, with
  # no further PR. Once that first run is green, set E2E_REQUIRED=true (CONTEXT.md).
  #
  # The three repos are checked out side by side (docket-runner/, city-hall/, bot-plugins/), not
  # nested: run.sh runs `pnpm install` in city-hall, and a city-hall inside this checkout would
  # find this repo's pnpm-workspace.yaml above it.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          path: docket-runner
          persist-credentials: false
      # The pins live only in test/e2e/pins.env; each becomes an env var for the checkouts below.
      - name: Load the pins
        run: grep -E '^[A-Z_]+=[0-9a-f]{40}$' docket-runner/test/e2e/pins.env >> "$GITHUB_ENV"
      - name: Probe read access to Lepid-Labs/city-hall
        id: probe
        env:
          TOKEN: ${{ secrets.CITY_HALL_READ_TOKEN }}
          E2E_REQUIRED: ${{ vars.E2E_REQUIRED }}
        run: |
          reason=
          if [ -z "$TOKEN" ]; then
            reason="CITY_HALL_READ_TOKEN is not available to this run (e.g. a fork or Dependabot PR, or the secret is unset)"
          else
            code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-all-errors \
              --max-time 20 -H "Authorization: Bearer $TOKEN" \
              https://api.github.com/repos/Lepid-Labs/city-hall) || code=000
            case "$code" in
              200) ;;
              401)
                reason="CITY_HALL_READ_TOKEN was refused (HTTP 401): expired or revoked; renew it (the current token expires 2026-12-31)"
                ;;
              403 | 404)
                reason="CITY_HALL_READ_TOKEN cannot read Lepid-Labs/city-hall (HTTP $code; most likely the Lepid-Labs owner has not yet approved the token)"
                ;;
              000)
                echo "::error::No response from api.github.com probing Lepid-Labs/city-hall (after 3 retries)"
                exit 1
                ;;
              *)
                echo "::error::Unexpected HTTP $code probing Lepid-Labs/city-hall (after retries)"
                exit 1
                ;;
            esac
          fi
          if [ -n "$reason" ]; then
            if [ "$E2E_REQUIRED" = true ]; then
              echo "::error::$reason"
              exit 1
            fi
            echo "::warning title=e2e skipped::$reason; end-to-end check skipped"
            printf '### End-to-end check skipped\n\n%s; end-to-end check skipped.\n' "$reason" >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.probe.outputs.ok == 'true'
        uses: actions/checkout@v7
        with:
          repository: Lepid-Labs/city-hall
          ref: ${{ env.CITY_HALL_PIN }}
          token: ${{ secrets.CITY_HALL_READ_TOKEN }}
          path: city-hall
          persist-credentials: false
      - if: steps.probe.outputs.ok == 'true'
        uses: actions/checkout@v7
        with:
          repository: Rackbops/rackbops-bot-plugins
          ref: ${{ env.BOT_PLUGINS_PIN }}
          path: bot-plugins
          persist-credentials: false
      # Third-party actions in this job are pinned to full commit SHAs: it holds a private-repo token.
      - if: steps.probe.outputs.ok == 'true'
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - if: steps.probe.outputs.ok == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: docket-runner/package.json
      # Node 26 explicitly, not .nvmrc (24): the version the runner's image ships (Dockerfile).
      - if: steps.probe.outputs.ok == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: docket-runner/pnpm-lock.yaml
      - if: steps.probe.outputs.ok == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: bot-plugins/package.json
      - if: steps.probe.outputs.ok == 'true'
        working-directory: docket-runner
        run: just install
      # The token is not in this step's environment, but any code in the job (including the three
      # dependency trees) could still read it from the runner. The exposure is accepted: it is a
      # read-only Contents token for one repo, and fork and Dependabot PRs get no secrets (Renovate
      # branches are same-repo, so they do get it).
      - if: steps.probe.outputs.ok == 'true'
        working-directory: docket-runner
        env:
          CITY_HALL_DIR: ${{ github.workspace }}/city-hall
          BOT_PLUGINS_DIR: ${{ github.workspace }}/bot-plugins
          E2E_OUT: ${{ runner.temp }}/e2e-logs
        run: just e2e
      # This repo is public, and so is the artifact: everything city-hall wrote or answered (its
      # build log, server logs, databases, job reads and job ids) is left out.
      - if: failure() && steps.probe.outputs.ok == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs
          path: |
            ${{ runner.temp }}/e2e-logs
            !${{ runner.temp }}/e2e-logs/city-hall-build.log
            !${{ runner.temp }}/e2e-logs/*.city-hall.log
            !${{ runner.temp }}/e2e-logs/*.db
            !${{ runner.temp }}/e2e-logs/*.db-*
            !${{ runner.temp }}/e2e-logs/*.job.json
            !${{ runner.temp }}/e2e-logs/*.id
          if-no-files-found: ignore
          retention-days: 3
